<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำตัว - ปราณปรียา สาลีผล</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .profile-card {
            background-color: #ffffff;
            width: 360px;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            z-index: 1;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            position: relative;
            z-index: 2;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 22px;
            color: #333333;
            margin: 15px 0 5px 0;
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 14px;
            color: #ff758c;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .bio {
            font-size: 14px;
            color: #666666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .social-links a {
            display: inline-block;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%);
            color: #fff;
            text-decoration: none;
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s;
        }

        .social-links a:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- ใส่รูปการ์ตูนเด็กผู้หญิงน่ารักๆ ไว้ให้เรียบร้อยแล้ว -->
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" alt="รูปโปรไฟล์การ์ตูน" class="profile-img">
        
        <h1>ปราณปรียา สาลีผล</h1>
        <div class="title">ยินดีที่ได้รู้จักค่ะ ✨</div>
        
        <p class="bio">
            สวัสดีค่ะ! ยินดีต้อนรับเข้าสู่เว็บไซต์แนะนำตัวของฉัน สนใจพูดคุยหรือทำความรู้จักกันได้เลยนะคะ
        </p>

        <div class="social-links">
            <a href="#" target="_blank">สิ่งที่ไม่ชอบ</a>เป๊ยก
            <a href="#" target="_blank">ความชอบ</a>แมว
        </div>
    </div>

</body>
</html>
